version: '3.8'

services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html

  mysql:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: wait
      MYSQL_DATABASE: mahasiswa
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql